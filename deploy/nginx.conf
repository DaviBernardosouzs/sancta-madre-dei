# Site estático gerado (dist/). Cada página é um index.html em sua pasta; não é um app de página única.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # redirecionamentos relativos (/aparicoes -> /aparicoes/), corretos atrás de proxy
    absolute_redirect off;

    # ==========================================
    # Páginas: 404 no idioma da pasta
    # ==========================================

    location ~ ^/(?<idioma>en|es|fr|it|de|ja|zh)/ {
        try_files $uri $uri/ =404;
        error_page 404 /$idioma/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    # ==========================================
    # Arquivos do site (sem hash no nome: cache curto)
    # ==========================================

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Aplicativo instalável (PWA): o service worker nunca fica em cache, para as atualizações chegarem logo
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # O contador de visitas só existe no Cloudflare (worker/). Aqui a API não existe e o rodapé não mostra o contador.
    location /api/ {
        default_type application/json;
        return 404 '{"erro":"não encontrado"}';
    }

    # ==========================================
    # Compressão
    # ==========================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ==========================================
    # Headers básicos de segurança
    # ==========================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
